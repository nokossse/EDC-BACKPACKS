plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'modern-backpacks'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Curios mixins are SRG-named; remap them for official mappings in userdev.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // flatDir + fg.deobf: files() collections are not deobfuscated by FG 6.
    implementation fg.deobf('local:simplebedrockmodel:2.5.1-forge-mc1.20.1')
    // Test-only armor mod (SRG-named jar, so it must go through deobf; run/mods would not remap it). Skipped if absent.
    if (file('libs/brimm-3.0.1.jar').exists()) {
        runtimeOnly fg.deobf('local:brimm:3.0.1')
    }
    // Test-only: TACZ guns for the backpack weapon slots (soft dependency in the mod itself). Skipped if absent.
    if (file('libs/tacz-1.1.8-hotfix.jar').exists()) {
        runtimeOnly fg.deobf('local:tacz:1.1.8-hotfix')
    }
    // MAE is SBM's jar-in-jar library (no mods.toml); needed on the compile classpath only.
    compileOnly files('libs/mae-1.1.4.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    inputs.dir 'asset'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('asset') {
        into 'assets/modern_backpacks/textures/asset'
        include '*.png'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // SBM is embedded as a nested mod (jar-in-jar, LGPL-3.0, unmodified), so players install one file.
    from('libs/simplebedrockmodel-2.5.1-forge-mc1.20.1.jar') { into 'META-INF/jarjar' }
    // Only in the built jar: in dev runs the folder is on the classpath and Forge would look for the nested jar.
    from('jarjar/metadata.json') { into 'META-INF/jarjar' }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.register('extractMae', Copy) {
    from(zipTree('libs/simplebedrockmodel-2.5.1-forge-mc1.20.1.jar')) {
        include 'META-INF/jarjar/mae-1.1.4.jar'
        eachFile { details ->
            details.path = 'mae-1.1.4.jar'
        }
        includeEmptyDirs = false
    }
    into 'libs'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn 'extractMae'
}
